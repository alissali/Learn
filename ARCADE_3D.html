<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOF ARCADE 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:monospace}
canvas{display:block}
#hud{position:absolute;top:15px;left:20px;right:20px;display:flex;justify-content:space-between;color:#0f0;font-size:0.7em;z-index:10;pointer-events:none;text-shadow:0 0 10px #0f0}
#start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0f0;font-size:1.5em;cursor:pointer;z-index:20;background:rgba(0,0,0,0.9);padding:20px 40px;border:2px solid #0f0;text-align:center}
#start:hover{box-shadow:0 0 30px #0f0}
#boss-bar{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:none;z-index:10}
#boss-bar-fill{height:15px;background:#f00;width:200px;border:1px solid #fff}
#prize-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;z-index:30;pointer-events:none;background:rgba(0,0,0,0.7)}
#prize-box{text-align:center;animation:prizeAnim 2.5s ease-out forwards;color:#ff0;font-size:1.5em}
@keyframes prizeAnim{0%{opacity:1;transform:scale(0.3)}50%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.4)}}
#prize-gallery{position:absolute;bottom:60px;right:20px;display:flex;gap:8px;z-index:10;flex-wrap:wrap;max-width:200px;justify-content:flex-end}
.prize-icon{font-size:1.5em;opacity:0.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="sk">🦴🦴🦴</span><span>MOLT:<span id="mc">🦴🦴🦴</span></span><span>💎<span id="ts">0</span></span><span id="lv">UOVO</span></div>
<div id="start">BOF ARCADE 3D<br><small style="font-size:0.35em">WASD=Move | SPACE=Tongue | E=Molt</small><br><small style="font-size:0.5em;color:#ff0">CLICK TO START</small></div>
<div id="boss-bar"><div id="boss-bar-fill"></div></div>
<div id="prize-overlay"><div id="prize-box"></div></div>
<div id="prize-gallery"></div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}resize();window.addEventListener('resize',resize);
function project(x,y,z){const d=55,scale=d/(z+d);return{x:W/2+(x*scale*W/2)/30,y:H/2-(y*scale*H/2)/30,scale}}
function drawSphere(x,y,z,r,color,fill=false){const p=project(x,y,z);if(p.scale<=0)return;const sr=r*p.scale*W/30;if(sr<0.5)return;ctx.fillStyle=ctx.strokeStyle=color;ctx.lineWidth=1.5*p.scale;ctx.beginPath();ctx.arc(p.x,p.y,sr,0,Math.PI*2);fill?ctx.fill():ctx.stroke()}
function drawLine(x1,y1,z1,x2,y2,z2,color,w=1){const p1=project(x1,y1,z1),p2=project(x2,y2,z2);if(p1.scale<=0||p2.scale<=0)return;ctx.strokeStyle=color;ctx.lineWidth=w*Math.min(p1.scale,p2.scale);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}
function drawText(x,y,z,text,color,size=12){const p=project(x,y,z);if(p.scale<=0)return;ctx.fillStyle=color;ctx.font=(size*p.scale)+'px monospace';ctx.textAlign='center';ctx.fillText(text,p.x,p.y)}
const PRIZES={10:{e:'🌟',n:'STAR',m:'First Threshold!'},25:{e:'🃏',n:'TAROT CARD',m:'The Deck Awakens!'},50:{e:'🐍',n:'SERPENT SKIN',m:'BOF Is Pleased!'},75:{e:'💀',n:'SKULL KEY',m:'The Bone Grins!'},100:{e:'💎',n:'DIAMOND',m:'YOU ARE THE DIAMOND!'},150:{e:'👑',n:'CROWN',m:'KING OF THE ARCADE!'},200:{e:'🌌',n:'GALAXY',m:'UNIVERSE COMPLETE!'}};
let pe={},pc=0;
function checkP(){for(const[t,p]of Object.entries(PRIZES)){if(tc>=parseInt(t)&&!pe[t]){pe[t]=true;pc++;const b=document.getElementById('prize-box');b.innerHTML=p.e+'<br>'+p.n+'<br><small style="font-size:0.4em">'+p.m+'</small>';const o=document.getElementById('prize-overlay');o.style.display='flex';b.style.animation='none';b.offsetHeight;b.style.animation='prizeAnim 2.5s ease-out forwards';setTimeout(()=>o.style.display='none',2500);const g=document.getElementById('prize-gallery'),icon=document.createElement('span');icon.textContent=p.e;icon.className='prize-icon';icon.title=p.n;g.appendChild(icon)}}}
let bx=0,by=2,bz=0,angle=0,speed=0.3,truths=[],enemies=[],skins=[],parts=[],projs=[],tc=0,lives=3,level=0,gr=false,moltCd=0,moltCh=3,bossActive=false,boss=null,keys={};
const LEVS=['UOVO','SERPENTE','CACCIATORE','ORACOLO','DIAMANTE'],BOARD=44;
function spawnT(n){for(let i=0;i<n;i++)truths.push({x:(Math.random()-0.5)*BOARD,y:2+Math.random()*5,z:(Math.random()-0.5)*BOARD,p:Math.random()*Math.PI*2})}
function spawnE(n){for(let i=0;i<n;i++)enemies.push({x:(Math.random()-0.5)*BOARD,y:1.5,z:(Math.random()-0.5)*BOARD,s:0.06+Math.random()*0.1,hp:1,boss:false})}
function spawnP(x,y,z,color,n){for(let i=0;i<n;i++)parts.push({x,y,z,vx:(Math.random()-0.5)*1.5,vy:Math.random()*2,vz:(Math.random()-0.5)*1.5,life:30,color})}
function spawnPr(x,y,z,vx,vy,vz){projs.push({x,y,z,vx,vy,vz,life:150,color:'#f66'})}
function molt(){if(moltCd>0||moltCh<=0)return;moltCd=25;moltCh--;skins.push({x:bx,y:by,z:bz,life:180});if(skins.length>20)skins.shift();spawnP(bx,by,bz,'#0f0',20);for(let i=enemies.length-1;i>=0;i--){if(Math.hypot(bx-enemies[i].x,by-enemies[i].y,bz-enemies[i].z)<12){if(enemies[i].boss){boss.hp-=2;spawnP(enemies[i].x,enemies[i].y,enemies[i].z,'#ff0',15)}else{spawnP(enemies[i].x,enemies[i].y,enemies[i].z,'#0f0',8);enemies.splice(i,1);tc++}}}}
function tongue(){const dx=Math.sin(angle)*10,dz=Math.cos(angle)*10,tx=bx+dx,tz=bz+dz;spawnP(tx,by,tz,'#f69',15);for(let i=enemies.length-1;i>=0;i--){if(Math.hypot(tx-enemies[i].x,by-enemies[i].y,tz-enemies[i].z)<5){if(enemies[i].boss){boss.hp--;spawnP(enemies[i].x,enemies[i].y,enemies[i].z,'#ff0',10)}else{enemies.splice(i,1);tc+=2}}}for(let i=truths.length-1;i>=0;i--){if(Math.hypot(tx-truths[i].x,by-truths[i].y,tz-truths[i].z)<6){truths.splice(i,1);tc++}}}
function spawnBoss(){bossActive=true;boss={x:0,y:10,z:-40,hp:15,maxHp:15,timer:0,boss:true};enemies.push(boss)}
function step(){if(!gr)return;let mx=0,mz=0;if(keys['w']||keys['arrowup'])mz=-1;if(keys['s']||keys['arrowdown'])mz=1;if(keys['a']||keys['arrowleft'])mx=-1;if(keys['d']||keys['arrowright'])mx=1;if(mx||mz){angle=Math.atan2(mx,mz);bx+=mx*speed;bz+=mz*speed}bx=Math.max(-BOARD/2,Math.min(BOARD/2,bx));bz=Math.max(-BOARD/2,Math.min(BOARD/2,bz));by=2+Math.sin(Date.now()*0.005)*0.3;for(let i=truths.length-1;i>=0;i--){truths[i].p+=0.04;truths[i].y=2+Math.sin(truths[i].p)*1.5;if(Math.hypot(bx-truths[i].x,by-truths[i].y,bz-truths[i].z)<2.8){spawnP(truths[i].x,truths[i].y,truths[i].z,'#ff0',5);truths.splice(i,1);tc++}}for(let e of enemies){const d=Math.hypot(bx-e.x,by-e.y,bz-e.z)||1;e.x+=(bx-e.x)/d*e.s;e.z+=(bz-e.z)/d*e.s;e.y=1.5+Math.sin(Date.now()*0.003)*0.3;if(!e.boss&&d<2.3)loseL()}if(bossActive&&boss){boss.timer++;boss.x+=Math.sin(boss.timer*0.02)*0.3;boss.z=-35+Math.sin(boss.timer*0.015)*5;if(boss.timer%25===0)spawnPr(boss.x,boss.y,boss.z,(bx-boss.x)*0.025,(by-boss.y)*0.025,(bz-boss.z)*0.025);if(Math.hypot(bx-boss.x,by-boss.y,bz-boss.z)<7)loseL();if(boss.hp<=0){spawnP(boss.x,boss.y,boss.z,'#ff0',50);enemies=enemies.filter(e=>!e.boss);bossActive=false;boss=null;tc+=20}}for(let i=projs.length-1;i>=0;i--){projs[i].x+=projs[i].vx;projs[i].y+=projs[i].vy;projs[i].z+=projs[i].vz;projs[i].life--;if(projs[i].life<=0||projs[i].y<0){projs.splice(i,1);continue}if(Math.hypot(bx-projs[i].x,by-projs[i].y,bz-projs[i].z)<2.5){projs.splice(i,1);loseL()}}for(let i=parts.length-1;i>=0;i--){parts[i].x+=parts[i].vx;parts[i].y+=parts[i].vy;parts[i].z+=parts[i].vz;parts[i].life--;if(parts[i].life<=0)parts.splice(i,1)}for(let i=skins.length-1;i>=0;i--){skins[i].life--;if(skins[i].life<=0)skins.splice(i,1)}if(moltCd>0)moltCd--;const nl=tc>=80?4:tc>=60?3:tc>=40?2:tc>=20?1:0;if(nl>level){level=nl;moltCh=Math.min(moltCh+1,3)}if(tc>=100&&!bossActive)spawnBoss();if(truths.length<20&&Math.random()<0.1)spawnT(1);if(enemies.filter(e=>!e.boss).length<4+level&&Math.random()<0.03)spawnE(1);checkP();updateH()}
function loseL(){lives--;spawnP(bx,by,bz,'#f44',25);if(lives<=0){gr=false;document.getElementById('start').style.display='block';document.getElementById('start').innerHTML='GAME OVER<br><small style="font-size:0.5em">Truths: '+tc+' | '+LEVS[level]+'</small><br><small style="font-size:0.5em;color:#ff0">CLICK</small>'}}
function updateH(){document.getElementById('sk').textContent='🦴'.repeat(Math.max(0,lives))+'💀'.repeat(Math.max(0,3-lives));document.getElementById('mc').textContent='🦴'.repeat(moltCh);document.getElementById('ts').textContent=tc;document.getElementById('lv').textContent=LEVS[Math.min(level,4)]+(bossActive?' ⚠BOSS':'');if(bossActive&&boss){document.getElementById('boss-bar').style.display='block';document.getElementById('boss-bar-fill').style.width=(200*boss.hp/boss.maxHp)+'px'}else{document.getElementById('boss-bar').style.display='none'}}
function draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);for(let i=0;i<150;i++){ctx.fillStyle='rgba(255,255,255,'+(0.2+Math.sin(Date.now()*0.001+i)*0.2)+')';ctx.fillRect((i*137.5%W),(i*251.3%H),1.5,1.5)}for(let i=-BOARD/2;i<=BOARD/2;i+=4){drawLine(i,0,-BOARD/2,i,0,BOARD/2,'rgba(0,255,136,0.06)');drawLine(-BOARD/2,0,i,BOARD/2,0,i,'rgba(0,255,136,0.06)')}for(let s of skins)drawSphere(s.x,s.y,s.z,2.2*s.life/180,'rgba(0,255,136,'+(0.25*s.life/180)+')');for(let t of truths)drawSphere(t.x,t.y,t.z,0.7,'#ff0',true);for(let e of enemies){if(e.boss){drawSphere(e.x,e.y,e.z,5,'#f00');drawText(e.x,e.y-7,e.z,'BOSS','#f00',14)}else drawSphere(e.x,e.y,e.z,1,'#f44')}for(let p of projs)drawSphere(p.x,p.y,p.z,0.4,p.color,true);for(let p of parts)drawSphere(p.x,p.y,p.z,0.15*p.life/30,p.color,true);const segs=[];for(let i=0;i<5;i++){const sx=bx-Math.sin(angle)*(i*2.2),sz=bz-Math.cos(angle)*(i*2.2),sy=1.5+Math.sin(Date.now()*0.005+i*0.5)*0.25;segs.push({x:sx,y:sy,z:sz,r:1.5-i*0.12})}for(let i=segs.length-1;i>=0;i--)drawSphere(segs[i].x,segs[i].y,segs[i].z,segs[i].r,i===0?'#fff':'#0f0',i===0);const tx=bx+Math.sin(angle)*3,tz=bz+Math.cos(angle)*3;drawLine(bx+Math.sin(angle)*1.5,by,bz+Math.cos(angle)*1.5,tx,by,tz,'#f69',2)}
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();if(!gr)startG();else tongue()}if(e.key==='e'&&gr){e.preventDefault();molt()}});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function startG(){truths=[];enemies=[];skins=[];parts=[];projs=[];pe={};tc=0;lives=3;level=0;pc=0;moltCd=0;moltCh=3;bossActive=false;boss=null;bx=0;by=2;bz=0;angle=0;spawnT(25);spawnE(4);document.getElementById('start').style.display='none';document.getElementById('prize-gallery').innerHTML='';gr=true;updateH()}
document.getElementById('start').addEventListener('click',startG);
function loop(){step();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
