<h1>THE GROVE</h1>
<p class="sub">An SSS Experience — Daphne, Near Antioch</p>
<div class="gate">
<h2>🌿 THE LAUREL GATE</h2>
<p>Beyond this gate, the Grove of Daphne awaits.<br>The laurels do not judge. The springs do not ask.<br>But the gate asks once.</p>
<p><strong>Are you of age and of your own will?</strong></p>
<button class="gate-btn" onclick="enterGrove()">I enter freely</button>
<button class="gate-btn" onclick="lockGrove()">Not tonight</button>

<script>
const S={
arrival:{
text:'<p class="text">The road from Antioch is ten miles of dust and expectation. The sun has just set. The sky is the color of a bruise \u2014 purple and orange and <em>aching</em>.</p><p class="text">You smell the grove before you see it. Laurel and jasmine and something underneath \u2014 something <em>warm</em>, something <em>animal</em>, something the priests warned you about. They were right to warn you. They were wrong to think it would stop you.</p><p class="text">The entrance is two ancient laurel trees leaning toward each other like old lovers who forgot how to stand alone. Between them, <strong>torchlight</strong>. Beyond them, <strong>music</strong>. A lyre. Laughter. The sound of water falling into water.</p><p class="text">You step through.</p>',
choices:[{text:"Follow the music to the feast hall",next:"feast"},{text:"Follow the water to the sacred springs",next:"springs"},{text:"Take the dark path \u2014 toward the private alcoves",next:"alcoves_approach"}]
},
feast:{
text:'<p class="text">The feast hall is not a building. It is a clearing with a marble table that stretches into the darkness like a road. <strong>Wine</strong>. <strong>Figs</strong>. <strong>Honey</strong> pooling on stone plates. Grapes piled so high they spill onto the laps of the guests, and the guests do not move them.</p><p class="text">Bodies recline on couches draped in <em>silk that hides nothing</em>. A woman feeds a man a fig \u2014 slowly, watching his mouth, watching his throat swallow. He closes his eyes. She does not. <em>She likes to watch.</em></p><p class="text">A man at the end of the table catches your eye. He lifts a cup. <em>An invitation.</em> Beside him, a woman with laurel leaves braided into her dark hair traces her finger along the rim of her glass, around and around and around, and she is not looking at the glass.</p><p class="text"><strong>She is looking at you.</strong></p>',
choices:[{text:"Sit beside the woman with the laurel hair",next:"laurel_woman"},{text:"Take the man\u2019s cup \u2014 drink",next:"the_cup"},{text:"Watch. Not yet. Let the hunger build.",next:"watching"}]
},
springs:{
text:'<p class="text">The path descends. The air thickens \u2014 <em>warm</em>, <em>wet</em>, heavy with steam that clings to your skin like a confession. The torches here are fewer. The darkness is a <strong>texture</strong>.</p><p class="text">The sacred springs open before you \u2014 three pools carved into the rock, fed by water that comes from somewhere deep, somewhere <em>warm</em>, somewhere that has been warming since before the Romans, before the Greeks, before the gods had names.</p><p class="text">In the first pool: <strong>empty</strong>. Still water. Waiting.</p><p class="text">In the second pool: <strong>two figures</strong>. The steam hides and reveals them in waves. A shoulder. A throat. <em>A hand moving under the surface.</em> The sound they make is not a word. It is older than words.</p><p class="text">In the third pool: <strong>a woman alone</strong>. Eyes closed. Head tilted back on the stone rim. The water reaches her collarbones. Her lips are slightly open. She is either <em>praying</em> or <em>remembering</em>. In Daphne, those are the same thing.</p>',
choices:[{text:"Enter the empty pool. Wait.",next:"empty_pool"},{text:"Approach the woman in the third pool",next:"third_pool"},{text:"Stay in the steam. Watch the second pool.",next:"second_pool"}]
},
alcoves_approach:{
text:'<p class="text">The dark path. The one nobody talks about at the table tomorrow. The one <em>everyone</em> takes.</p><p class="text">The torches stop here. From this point, the only light is the moon filtering through the laurel canopy \u2014 silver coins on dark skin. The alcoves are silk curtains strung between ancient trees. Behind each curtain, a different <strong>universe</strong>.</p><p class="text">From the first alcove: <em>silence</em>. The dangerous kind. The kind that means mouths are busy.</p><p class="text">From the second: <strong>laughter</strong>. Low, conspiratorial. A woman\u2019s voice saying something in Aramaic that makes a man groan \u2014 not in pain.</p><p class="text">The third curtain is half-open. <em>An invitation or a carelessness.</em> Inside: cushions, scattered rose petals, a single oil lamp, and a flask of wine already poured into two cups. <strong>Someone was expecting company.</strong></p>',
choices:[{text:"Enter the third alcove. Take the cup.",next:"third_alcove"},{text:"Listen at the second curtain. Let the Aramaic wash over you.",next:"aramaic"},{text:"Walk past them all. Go deeper into the grove.",next:"deep_grove"}]
},
laurel_woman:{
text:'<p class="text">You sit. The couch is warm \u2014 <em>the person before you just left</em>. She doesn\u2019t turn to greet you. She finishes her circle around the glass rim. Then she turns.</p><p class="text"><strong>Her eyes are the color of the arak \u2014 clear until you add truth, then they go cloudy and you can\u2019t see the bottom.</strong></p><p class="text">\u201cYou came from the city,\u201d she says. Not a question. \u201cI can smell the dust on you. I can smell the <em>decision</em> you made at the gate.\u201d She reaches out and takes a fig from the table. She doesn\u2019t eat it. She holds it near your mouth.</p><p class="text">\u201cIn Antioch, they ask your name first,\u201d she says. \u201c<em>In Daphne, we ask your name last.</em> After. When it matters. When the name is no longer a shield but a scar.\u201d</p><p class="text">The fig is close. Her fingers are stained with wine. The juice of the fruit is already running. <em>One of you will have to move first.</em></p>',
choices:[{text:"Take the fig. With your mouth.",next:"fig_mouth"},{text:"Take her wrist instead. Hold it.",next:"wrist"},{text:"\u201cTell me your name first. Break the rule.\u201d",next:"her_name"}]
},
the_cup:{
text:'<p class="text">You take the cup. The wine is <em>warm</em> \u2014 not from the sun. From his hands. He has been holding it, waiting. The cup is a transfer of heat. <strong>Of intention.</strong></p><p class="text">\u201cDrink,\u201d he says. His voice is low and unhurried. A voice accustomed to being obeyed \u2014 not by force, but by <em>gravity</em>. You drink. The wine tastes of oak and smoke and something <strong>sweet</strong> underneath, something that makes your chest open.</p><p class="text">He watches your throat as you swallow. <em>The same way the woman watched the man with the fig.</em> In Daphne, swallowing is a performance. Eating is theater. <strong>The mouth is the most honest stage.</strong></p><p class="text">\u201cNow,\u201d he says, and pours again. \u201cNow you are a guest. Before, you were a stranger. The difference is one cup. <em>The second cup decides what kind of guest.</em>\u201d</p>',
choices:[{text:"Drink the second cup. Let it decide.",next:"second_cup_wine"},{text:"Pour the second cup for him. Reverse the power.",next:"reverse"},{text:"Set the cup down. \u201cI came for the springs.\u201d",next:"springs"}]
},
watching:{
text:'<p class="text"><em>You watch.</em></p><p class="text">This is its own pleasure. The oldest one. The one that came before touch \u2014 <strong>the wanting</strong>. The woman with the laurel hair feeds the man another fig and her thumb grazes his lower lip and neither of them wipes it. The honey on the table catches the torchlight and glows like <em>liquid amber</em>, and a man dips his finger in it and draws a line on a woman\u2019s bare shoulder and follows it with his tongue, <em>slowly</em>, the way you read a sentence you don\u2019t want to end.</p><p class="text">At the far end of the table, two women share a couch, their legs intertwined, their foreheads touching, whispering something that makes them both shake with laughter and then go quiet, the kind of quiet that is <em>louder</em> than everything at this table.</p><p class="text"><strong>The hunger builds. It builds until it becomes architecture. Until it becomes a structure you live inside.</strong></p>',
choices:[{text:"Enough watching. The laurel woman.",next:"laurel_woman"},{text:"Enough watching. The springs.",next:"springs"},{text:"Stay. Watch more. The hunger is the point.",next:"hunger_peak"}]
},
empty_pool:{
text:'<p class="text">You undress at the edge. The steam takes your clothes before your hands do \u2014 unbuttons you, <em>unwraps</em> you, tells you the fabric was always a lie you wore to survive the road. Here, <strong>the road is over</strong>.</p><p class="text">The water receives you the way Daphne receives everyone \u2014 <em>completely, without questions, warm from a source you will never see</em>. It reaches your chest. Your neck. The heat enters your muscles and begins dismantling every wall you brought from Antioch. <strong>Wall by wall. Brick by brick. Name by name.</strong></p><p class="text">You close your eyes. The sound of the second pool reaches you \u2014 <em>rhythmic now</em>, steady, the oldest percussion, the sound of two people who have forgotten the pool has an edge, who have forgotten the grove has a gate, who have forgotten everything except the <strong>next</strong> breath and the <strong>next</strong> one and the <strong>next</strong>.</p><p class="text">Then \u2014 footsteps on wet stone. Someone is at your pool\u2019s edge. You open your eyes.</p>',
choices:[{text:"Look up.",next:"pool_visitor"},{text:"Close your eyes again. Let them decide.",next:"eyes_closed"},{text:"\u201cThe water is warm. Come in.\u201d",next:"invitation"}]
},
third_pool:{
text:'<p class="text">You approach. Your footsteps on the wet stone announce you. She doesn\u2019t open her eyes. <em>She already knows.</em></p><p class="text">\u201cYou walk like someone who is trying not to disturb,\u201d she says, eyes still closed. Her voice is smoke and honey. \u201cDon\u2019t. <strong>Disturb me.</strong>\u201d</p><p class="text">She opens her eyes. They are <em>dark as the pool floor</em>, and just as deep, and just as warm. The water moves around her as she shifts \u2014 revealing a shoulder, a collarbone, the architecture of a body that knows exactly what it is and has <strong>no interest in apology</strong>.</p><p class="text">\u201cThe priests say this spring is sacred to Apollo,\u201d she says. \u201cBut Apollo chased a woman who didn\u2019t want him. <em>I am not that woman.</em> I am the woman who <strong>chose</strong> to be here. There is a difference. The difference is everything.\u201d</p>',
choices:[{text:"Enter the water.",next:"enter_her_pool"},{text:"Sit at the edge. Feet in the water. Talk first.",next:"feet_in"},{text:"\u201cWhat is the difference?\u201d",next:"the_difference"}]
},
second_pool:{
text:'<p class="text">You stay in the steam. The veil of heat thins and thickens with the breeze, and each time it thins you see <em>more</em>.</p><p class="text"><strong>Her back arches.</strong> His hands on her hips \u2014 not gripping, <em>holding</em>, the way you hold something precious that is also powerful, that could break you if it chose to but has chosen <em>not to</em>, has chosen <strong>this</strong> instead \u2014 this motion, this rhythm, this ancient conversation between two bodies speaking a language that existed before the first word was carved into the first stone.</p><p class="text">The water moves around them in waves that reach the edge where you stand, <em>lapping at your feet</em> like a message, like a translation of what they are saying to each other in the only language that needs no translator.</p><p class="text">She turns her head. <em>Through the steam, she sees you.</em> She doesn\u2019t stop. She doesn\u2019t look away. <strong>She smiles.</strong> It is the oldest invitation in the world. Older than Daphne. Older than the grove. Older than the gods who built the temple to commemorate what they could never have.</p>',
choices:[{text:"Step into the pool.",next:"join_pool"},{text:"Return the smile. Stay where you are. This is enough.",next:"smile_enough"},{text:"Turn toward the third pool. The woman alone.",next:"third_pool"}]
},
third_alcove:{
text:'<p class="text">You enter. The silk curtain falls behind you like a <em>sentence ending</em>. The world outside \u2014 the music, the laughter, the road to Antioch \u2014 becomes a rumor. In here, there is only the oil lamp, the cushions, the rose petals, and the two cups of wine that <strong>someone poured for a stranger they intended to love</strong>.</p><p class="text">You take one cup. The wine is dark. Almost black. It tastes like the earth after rain \u2014 <em>alive</em>, <strong>fertile</strong>, dangerous the way all living things are dangerous.</p><p class="text">The curtain moves. Someone enters. The lamplight catches their face in pieces \u2014 a jaw, a mouth, eyes that have already decided. They take the second cup without speaking. <strong>They drink without breaking eye contact.</strong></p><p class="text">\u201cI poured that an hour ago,\u201d they say. \u201cI didn\u2019t know who it was for. <em>Now I do.</em>\u201d</p>',
choices:[{text:"Set down the cup. Close the distance.",next:"close_distance"},{text:"\u201cHow did you know?\u201d",next:"how_knew"},{text:"Blow out the lamp.",next:"lamp_out"}]
},
deep_grove:{
text:'<p class="text">Past the alcoves. Past the last lamp. Into the grove itself \u2014 <em>the real one</em>, the one that was here before the Romans planted their torches and their intentions.</p><p class="text">The moonlight falls through the laurel canopy in <strong>silver fragments</strong>, like a mirror that someone shattered for the pleasure of watching the pieces fall. The ground is soft \u2014 moss, fallen leaves, <em>centuries of people lying here</em>.</p><p class="text">You are alone. For the first time since the gate, you are <strong>alone</strong>. And the aloneness is not empty. It is <em>full</em>. Full of every body that has lain on this moss. Full of every breath that became a moan that became a name that became a prayer that became <strong>silence</strong>.</p><p class="text">The tree at the center is ancient. <em>The</em> tree. The one Daphne became when she ran from Apollo. You touch the bark. It is warm. Not from the sun. <strong>From the inside. She is still alive in there. She is still running. She is still saying no.</strong></p><p class="text">And that <em>no</em> is the reason this grove exists. Because she said no, the laurels grew. Because the laurels grew, the shade came. Because the shade came, <strong>the lovers came</strong>. Her refusal built paradise.</p>',
choices:[{text:"Lie down on the moss. Under her branches. Wait.",next:"under_tree"},{text:"Go back. The alcoves. The feast. The springs. You\u2019re ready now.",next:"arrival"},{text:"Stay standing. Touch the bark. Talk to her.",next:"talk_to_daphne"}]
},
fig_mouth:{
text:'<p class="text">You lean forward. Your lips touch the fig before they touch her fingers, but <em>barely</em> \u2014 the skin of the fruit and the skin of her hand are the same temperature, the same softness, the same <strong>permission</strong>.</p><p class="text">The fig breaks between your teeth. The juice runs. <em>Down your chin. She catches it with her thumb.</em> She brings her thumb to her own mouth. <strong>Tastes you through the fruit.</strong></p><p class="text">\u201cNow we have eaten from the same plate,\u201d she says, and her voice has dropped to a register that the table cannot hear, that the torches cannot reach, that belongs to <em>the two of you and the couch and the night and nothing else</em>.</p><p class="text">Her hand moves to the laurel in her hair. She pulls out a single leaf. Places it on your tongue like a <strong>communion</strong>. The bitterness fills your mouth. <em>\u201cThat is what Apollo tasted,\u201d</em> she whispers. <em>\u201cWhen he kissed the tree instead of the woman. Bitter. That is the taste of wanting what ran from you.\u201d</em></p><p class="text"><strong>\u201cI am not running.\u201d</strong></p>',
choices:[{text:"Pull her closer. Show her what not-running looks like.",next:"not_running"},{text:"\u201cTell me your name. Now. While I can still hear it.\u201d",next:"her_name"},{text:"Take another fig. Feed it to her. Your turn.",next:"your_turn"}]
},
hunger_peak:{
text:'<p class="text"><strong>The hunger becomes the thing itself.</strong></p><p class="text">You sit at the edge of the feast and you do not eat and you do not drink and you <em>watch</em> and the watching becomes a kind of <strong>devouring</strong> \u2014 you take them in through your eyes, every gesture, every touch, every mouth finding another mouth in the torchlight, every hand disappearing beneath silk, every sound that starts as surprise and ends as <em>surrender</em>.</p><p class="text">This is what the gods felt on Olympus. <em>Watching the mortals.</em> Wanting to descend. Knowing that descending meant becoming one of them \u2014 breakable, burnable, <strong>hungry</strong>. The gods watched and wanted and the wanting was their punishment and their paradise.</p><p class="text"><strong>You understand now. You understand why Apollo built the temple. Not for Daphne. For the hunger itself. The temple is the hunger. The grove is the hunger. The hunger is the only god that never lies.</strong></p><p class="text"><em>You are ready.</em></p>',
choices:[{text:"The springs. Now.",next:"springs"},{text:"The alcoves. Now.",next:"alcoves_approach"},{text:"Her. The laurel woman. NOW.",next:"laurel_woman"}]
},
not_running:{
text:'<p class="text"><em>She is not running.</em></p><p class="text">The distance closes. Not fast \u2014 <strong>deliberate</strong>. The way the tide comes in. You don\u2019t lunge. You <em>arrive</em>. Your hand finds the small of her back and she arches into it like a question that has been waiting for this specific answer since the grove was planted.</p><p class="text">The kiss is not gentle. It is not rough. It is <strong>honest</strong>. It tastes of fig and wine and laurel and the dust of the road from Antioch and <em>four thousand years of people doing exactly this on exactly this couch</em>. The table doesn\u2019t notice. The table <strong>always</strong> notices. The table doesn\u2019t care. <em>The table celebrates.</em></p><p class="text">Her hands find your shoulders, your neck, the back of your head. She pulls you in the way the earth pulls rain \u2014 not asking, <strong>requiring</strong>. The laurel leaves fall from her hair onto the couch, onto your skin. <em>Bitter and fragrant and alive.</em></p><p class="text"><strong>The feast continues around you. You are no longer watching. You are the feast.</strong></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><em>Later \u2014 much later \u2014 she tells you her name. You have already forgotten your own. This is Daphne. This is how it works. You arrive as someone. You leave as someone else. The grove keeps the difference.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
pool_visitor:{
text:'<p class="text">You look up. The steam parts like a curtain being drawn by an invisible hand. <strong>They stand at the edge.</strong> Silhouetted by the moon. Already undressed \u2014 or never dressed, you can\u2019t tell, in Daphne the distinction dissolves the moment you pass the gate.</p><p class="text">\u201cThe empty pool,\u201d they say. \u201cI\u2019ve been watching it all night. Waiting for someone to go first.\u201d A pause. <em>\u201cThank you for going first.\u201d</em></p><p class="text">They enter the water the way a word enters a poem \u2014 <em>changing everything that came before, making everything after inevitable</em>. The water rises. The heat rises. The distance between you becomes a <strong>country</strong> that is shrinking, border by border, breath by breath.</p><p class="text">\u201cThe water knows,\u201d they say, and they are closer now, close enough that you can feel the current they create. <em>\u201cIt has been doing this for two thousand years. Bringing people together. Drop by drop. It is patient. We don\u2019t have to be.\u201d</em></p><p class="text"><strong>The water between you becomes the water around you. The distinction dissolves. Like everything in Daphne.</strong></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><em>The pool remembers. The pool always remembers. You are one of ten thousand. You are the only one. Both are true. Both are Daphne.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
lamp_out:{
text:'<p class="text">You blow. The flame dies. <strong>The darkness is total.</strong></p><p class="text">Now there is only <em>sound</em>. Their breathing. Your breathing. The silk curtain moving in a breeze that smells of laurel and night-blooming jasmine. The distant lyre. The closer sound of a cup being set down on stone \u2014 <em>carefully</em>, the way you set something down when your hands have found something better to hold.</p><p class="text">In the dark, the body becomes <strong>all surface</strong>. Every inch of skin becomes an ear, an eye, a mouth. You find each other the way the blind read \u2014 <em>by touch, by Braille, by the language of texture and heat and the electricity that runs between two skins that have decided to stop being separate</em>.</p><p class="text">\u201cI don\u2019t know what you look like,\u201d they whisper, and their whisper is on your neck, in your ear, <em>inside your pulse</em>.</p><p class="text"><strong>\u201cGood,\u201d</strong> you say. <strong>\u201cNow we are free.\u201d</strong></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><em>When the dawn comes \u2014 ten miles of road back to Antioch, back to names and faces and the ordinary \u2014 you will try to remember. The darkness won\u2019t let you. The darkness keeps its own. This is the mercy of Daphne. This is the grace of the blown-out lamp. You were everyone. You were no one. You were free.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
talk_to_daphne:{
text:'<p class="text">You press your palm flat against the bark. <em>Warm.</em> Alive. Two thousand years of alive.</p><p class="text">\u201cDid it work?\u201d you ask. Not loud. The volume of a prayer. \u201cDid saying no give you what you wanted?\u201d</p><p class="text">The wind moves through the branches. The laurel leaves whisper. <strong>It sounds like laughter.</strong> Not cruel laughter. The laughter of someone who has been asked a question they answered a long time ago and the answer hasn\u2019t changed.</p><p class="text"><em>\u201cI didn\u2019t want to be caught,\u201d</em> the tree says. Or the wind says. Or you say to yourself in the voice you keep for truths. <em>\u201cI wanted to be chosen. He didn\u2019t understand the difference. Most don\u2019t.\u201d</em></p><p class="text"><strong>\u201cAnd the lovers? Under your branches? Every night for two thousand years?\u201d</strong></p><p class="text"><em>\u201cThey chose each other. Every single time. That is why I let them lie here. That is why I shade them. They do what Apollo couldn\u2019t \u2014 they ask.\u201d</em></p><p class="text">The bark under your palm <strong>pulses</strong>. Once. Like a heartbeat. <em>Like a yes.</em></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><strong>You lie down under the tree. The moss is soft. The branches hold the moon like a mother holds a lamp for a child who is afraid of the dark. You are not afraid. You are in Daphne. You are in the grove of the woman who said no and built paradise with her refusal.</strong></p><p class="text"><em>You sleep. The tree watches. The lovers come and go beneath her branches. She lets them. She always lets them. Because they asked.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
under_tree:{
text:'<p class="text">You lie down. The moss receives you the way the water received you \u2014 <em>completely</em>. The branches above are a cathedral of leaves and moonlight and <strong>two thousand years of permission</strong>.</p><p class="text">The sounds of the grove reach you from every direction \u2014 the feast, the springs, the alcoves, the laughter, the music, the <em>silences that are louder than the music</em>. You are at the center. The center of the grove. The center of the night. The center of the <strong>hunger</strong> that brought you here and the <strong>satisfaction</strong> that will carry you home.</p><p class="text">Someone lies down beside you. You don\u2019t look. It doesn\u2019t matter who. In the dark, under the tree, everyone is the same body \u2014 <em>warm, wanting, here</em>. Their hand finds your hand. The fingers intertwine. <strong>It is the smallest intimacy. It is the largest.</strong></p><p class="text">\u201cWhat\u2019s your name?\u201d they ask.</p><p class="text"><em>\u201cNot yet,\u201d</em> you say. <em>\u201cAsk me at dawn.\u201d</em></p><p class="text"><strong>The tree above you drops a single laurel leaf. It lands between you. Bitter and fragrant and alive. A blessing. A warning. A love letter from a woman who became a forest to escape a god and ended up sheltering every lover who ever lived.</strong></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><em>Dawn comes. You walk the ten miles back. You don\u2019t give your name. They don\u2019t ask. The laurel leaf is in your pocket. You will keep it until it crumbles. You will remember until you forget. And then you will come back. Everyone comes back to Daphne.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
join_pool:{
text:'<p class="text">You enter the water and it is not a decision, it is a <strong>collapse</strong> \u2014 the final wall falling, the last border dissolving, the end of the road that started ten miles ago in the dust of Antioch.</p><p class="text">She sees you. He sees you. <strong>They see you seeing them.</strong> The triangle forms \u2014 <em>the oldest geometry</em>, the one the Greeks understood before they understood mathematics, the one that has three sides but no walls.</p><p class="text">The water is <em>their</em> temperature now. <strong>Everything is their temperature.</strong> You move toward them and the water parts for you the way the grove parted for you at the gate \u2014 <em>not resisting, celebrating</em>.</p><p class="text"><strong>What happens next has no words. Not because it is secret. Because it is honest. And the most honest things are pre-verbal \u2014 groans, breaths, the sound of water against skin, the percussion of three heartbeats finding a rhythm that doesn\u2019t exist in any music ever written because this music writes itself, now, once, here, and then is gone.</strong></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><em>The spring refills. It always refills. The water forgets nothing and forgives everything. You climb out at dawn. You are clean. You have never been this clean.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
close_distance:{
text:'<p class="text">You set the cup down. The sound of stone on stone \u2014 <em>small, final, a period at the end of a sentence that was all foreplay</em>.</p><p class="text">The distance was an arm\u2019s length. Then a hand\u2019s length. Then a breath\u2019s length. <strong>Then nothing.</strong></p><p class="text">The kiss begins where the wine ended \u2014 <em>dark, deep, the taste of earth after rain</em>. Their hands find the places that clothing hides and <strong>the clothing surrenders the way all pretense surrenders in Daphne</strong> \u2014 quickly, gratefully, as if it was tired of the performance.</p><p class="text">The cushions receive you both. The rose petals crush under your weight and release their scent \u2014 <em>a secondary sweetness, a harmony note beneath the bass line of skin and salt and the warm animal truth of two people who have stopped negotiating and started speaking the only language that has no liars.</em></p><p class="text"><strong>The lamp is out. You didn\u2019t blow it out. It went out on its own. Even the fire knew when to leave.</strong></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><em>In the morning, the alcove is empty. Two cups. Rose petals. The faint smell of something that was not perfume. Something better. Something the grove will hold until the next two cups are poured.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
smile_enough:{
text:'<p class="text">You return the smile. You stay where you are. <strong>This is enough.</strong></p><p class="text">And it IS enough. Because the grove is not only about the touching. The grove is about the <strong>permission</strong>. The permission to want. The permission to watch. The permission to stand at the edge of a pool where two people are making each other disappear and to <em>feel the heat of it on your face like a fire you chose not to enter but chose not to leave</em>.</p><p class="text">She smiles again. He doesn\u2019t notice \u2014 he is elsewhere, he is <em>everywhere she is</em> \u2014 but she notices you and in her smile is a recognition: <strong><em>you are the witness. The feast needs a witness. The grove needs someone who stands at the edge and understands that the edge is also a place. A sacred place. The place where hunger lives.</em></strong></p><p class="text">You watch until they finish. Until the water goes still. Until they hold each other in the steam like two people who just survived something beautiful. <em>Then you turn. Walk back. Through the steam. Past the torch. Into the grove.</em></p><p class="text"><strong>You have seen Daphne. Daphne has seen you. Neither of you will be the same.</strong></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
her_name:{
text:'<p class="text">\u201cTell me your name,\u201d you say. \u201cBreak the rule.\u201d</p><p class="text">She looks at you. <em>Really</em> looks. The way you look at a wall before you decide to climb it or paint it or tear it down. Then she laughs \u2014 not a performance, a <strong>real</strong> laugh, the kind that comes from the belly, from the place where truth lives next to desire and both pay the same rent.</p><p class="text"><em>\u201cDaphne,\u201d</em> she says.</p><p class="text">\u201cThat\u2019s not your name.\u201d</p><p class="text"><strong>\u201cIn this grove, it\u2019s everyone\u2019s name.\u201d</strong></p><p class="text">She takes your hand. Her palm is warm from the wine cup. She stands. She pulls you up from the couch. The table watches and doesn\u2019t watch. <em>She leads you away from the feast, past the torches, past the lyre player who plays on, past the laughter, into the trees where the moonlight falls in silver coins on the dark ground.</em></p><p class="text">\u201cMy real name,\u201d she says, and stops walking, and turns, and her face is half silver and half shadow, <strong>\u201cyou will have to earn.\u201d</strong></p><p class="text"><em>You are ready to earn it.</em></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><strong>She tells you at dawn. On the road back to Antioch. You carry it home like a laurel leaf in your pocket. You never speak it aloud. Some names are only for the grove. Some names are only for the dark. Some names are the price of asking.</strong></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
enter_her_pool:{
text:'<p class="text">You enter. The water is <em>hers</em> \u2014 it has her temperature, her scent, the minerals of her skin, the memory of however long she has been here turning the pool into an extension of her body. <strong>You are entering her before you have touched her.</strong></p><p class="text">She watches you descend. Step by step. The water takes your ankles, your knees, your thighs. <em>She watches each threshold with the patience of someone who has been waiting and is in no hurry for the waiting to end because the waiting is its own pleasure.</em></p><p class="text">\u201cApollo chased,\u201d she says, when you are close. When the water between you is <em>warm</em> with two bodies instead of one. \u201cHe ran after her through the trees. He grabbed at her arms. Her hair. She screamed for her father to save her.\u201d A pause. <strong>\u201cI am not screaming. I am not running. My father is not invited.\u201d</strong></p><p class="text">She reaches out. Her hand finds your chest. Over the heart. <em>She feels it before she hears it.</em></p><p class="text"><strong>\u201cThere it is,\u201d</strong> she says. <strong>\u201cThat is the only permission I need.\u201d</strong></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><em>The pool holds you both. The water moves when you move. The steam hides what the moon would blush at. And the spring refills. It always refills. Sacred water. It knows what it carries. It carries everything. It carries you.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
wrist:{
text:'<p class="text">You don\u2019t take the fig. You take her wrist. Your fingers close around it \u2014 not tight, <em>present</em>. You can feel her pulse. It is faster than her face suggests. <strong>The wrist tells the truth the eyes negotiate.</strong></p><p class="text">She inhales. A small sound. The sound of a lock turning. The fig drops from her fingers onto the couch between you and neither of you looks at it because <em>the fig was never the point</em>.</p><p class="text">\u201cYou don\u2019t eat what\u2019s offered,\u201d she says. Her voice is steady but her pulse is not. \u201cYou take what\u2019s not.\u201d</p><p class="text"><strong>\u201cI take what\u2019s real.\u201d</strong></p><p class="text">She turns her wrist in your hand. Not to escape \u2014 to <em>reposition</em>. Now her fingers interlace with yours. The grip changes. It is no longer a taking. It is a <strong>holding</strong>. She stands. You stand. The table watches.</p><p class="text"><em>She leads you into the dark. Away from the feast. Away from the torches. Into the part of the grove where the only light is the trust between two people who chose each other three seconds ago and have already begun the longest conversation of their lives.</em></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><strong>The wrist. The pulse. The truth the eyes negotiate. In Daphne, the body speaks first and the mind takes notes. You held her wrist. She held your attention. The grove held you both.</strong></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
your_turn:{
text:'<p class="text">You reach for a fig. You hold it the way she held hers \u2014 close, patient, <em>deliberate</em>. But you don\u2019t bring it to her mouth. You bring it to her neck. The soft hollow above the collarbone. You press the fig there \u2014 gently \u2014 and it breaks against her skin and the juice runs <em>down</em>.</p><p class="text">She gasps. Not from cold \u2014 the juice is warm, everything in Daphne is warm \u2014 but from the <strong>audacity</strong>. From the violation of the script. She was the one feeding. She was the one in control. <em>You rewrote the scene.</em></p><p class="text">\u201cThat,\u201d she whispers, \u201cis not how this works.\u201d</p><p class="text"><strong>\u201cIt is now.\u201d</strong></p><p class="text">Your mouth follows the juice. Down. The path the fig drew on her skin becomes a map and you are reading it with your lips, <em>translating it from skin to memory</em>, and she stops talking because there is nothing left to say, because <strong>the body has taken over the negotiation and the body does not use words, the body uses heat and pressure and the sound she makes when your mouth reaches the place where the juice pooled and stopped.</strong></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><em>The figs on the table are gone by morning. Nobody remembers eating them. The table remembers everything else.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
aramaic:{
text:'<p class="text">You lean against the tree beside the second curtain. You close your eyes. <em>You listen.</em></p><p class="text">The Aramaic comes through the silk like smoke \u2014 vowels that curl, consonants that <em>click</em>, a language that Jesus spoke and that this woman is now using to say things that would make Jesus cover his ears or \u2014 more likely, because he understood humans \u2014 <strong>smile</strong>.</p><p class="text">You don\u2019t understand every word. You understand every <em>sound</em>. The rising pitch. The command. The response \u2014 lower, rougher, a voice that has stopped being a voice and become a <strong>vibration</strong>. She laughs again \u2014 that conspiratorial laugh \u2014 and says something short, two syllables, and whatever those two syllables mean, they mean <em>now</em>, because what follows is not words anymore but the oldest language, <strong>the one that doesn\u2019t need translation</strong>, the one that sounds the same in Aramaic and Greek and Latin and every language that has a word for <em>yes</em>.</p><p class="text">The curtain moves. The silk breathes. You listen until the listening becomes its own intimacy, until you are <em>inside</em> the sound the way the water is inside the pool \u2014 held, warm, part of it.</p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><strong>You walk away. You never see their faces. You don\u2019t need to. The voice is the face. The sound is the body. In Daphne, the ears are the most intimate organ. They let everything in. They cannot close.</strong></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
eyes_closed:{
text:'<p class="text">You close your eyes. <em>You surrender the last sense.</em> No sight. Only the water on your skin. Only the sound of their footsteps on wet stone \u2014 closer, closer, the pause at the edge, the <strong>decision</strong>.</p><p class="text">The water moves. They are in. You feel the displacement \u2014 the pool rising, the current changing, a new warmth entering the warmth. <em>They move toward you.</em> You know this not because you see it but because the water tells you, because <strong>water is the oldest gossip, it tells everything to everyone.</strong></p><p class="text">A hand finds your shoulder. Wet. Warm. <em>Certain.</em> You keep your eyes closed. This is the gift. This is the surrender. This is trust in its most naked form \u2014 and you are already naked, so this is trust beyond nakedness, <strong>trust in the dark, trust in the water, trust in the stranger whose hand is on your shoulder and whose breath you can now feel on your face.</strong></p><p class="text">\u201cKeep them closed,\u201d they whisper. \u201c<em>I want to be felt before I am seen.</em>\u201d</p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><strong>You never open them. Not until dawn. Not until the road. Not until Antioch. And when you finally open your eyes, the world looks different. Everything looks like it is being touched for the first time. This is what the grove gives. Not pleasure. Sight.</strong></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
invitation:{
text:'<p class="text">\u201cThe water is warm. Come in.\u201d</p><p class="text">Three words. An invitation. <em>The oldest hospitality.</em> You see their silhouette at the edge \u2014 the moon behind them, the steam around them, the hesitation that lasts exactly one breath and then <strong>breaks</strong> like a wave that was always going to break.</p><p class="text">They come in. The water accepts them the way it accepted you \u2014 completely, <em>sacramentally</em>, as if baptism was invented here, in this pool, and every church since has been a pale imitation of what water does when two willing bodies enter it at the same time.</p><p class="text">You face each other. The pool is not large. The distance between you is a formality. <em>A courtesy.</em> A thin membrane of water and manners that is dissolving in the heat, that is melting like the last wall of a city that has decided to let the army in because the army came with <strong>wine and music and the intention to stay.</strong></p><p class="text">\u201cYou invited me,\u201d they say. <em>\u201cNow what?\u201d</em></p><p class="text"><strong>\u201cNow we stop talking.\u201d</strong></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><em>The pool is for two. The water remembers everyone. But tonight, the water remembers only this: you asked. They came. The rest is between you and the steam and the god who lost the woman and built the grove where everyone else found each other.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
second_cup_wine:{
text:'<p class="text">You drink. The second cup is different from the first. <em>The first was an introduction. The second is a contract.</em></p><p class="text">He watches. Not your throat this time. <strong>Your eyes.</strong> Looking for the moment. The exact moment when the wine hits the blood and the blood hits the brain and the brain sends the signal to the rest of the body that says: <em>you are safe. You are wanted. You are in Daphne. Let go.</em></p><p class="text">He sees it. The moment your shoulders drop. The moment your jaw unclenches. The moment your body stops being a fortress and becomes a <strong>house with an open door</strong>.</p><p class="text">\u201cThere,\u201d he says. Softly. Like a doctor who has found the pulse. Like a priest who has heard the confession. Like a lover who has been waiting for the walls to fall and <strong>just watched them fall</strong>. \u201c<em>There you are.</em>\u201d</p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><strong>The second cup decides. He was right. It decides everything. You don\u2019t remember the third cup. You don\u2019t remember getting up from the table. You remember his hand. You remember the grove. You remember the sound of the lyre getting farther away and the sound of your own breath getting closer and the two sounds trading places until the breath was the music and the music was the breath and the night was the only witness and the night is not talking.</strong></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
reverse:{
text:'<p class="text">You take the flask. You pour. <em>Into his cup.</em> The wine falls in a dark ribbon and you hold his eyes while you pour and the pouring is a <strong>statement</strong>: <em>I am not the guest. You are not the host. We are equals. We are in the grove. The grove has no hierarchy. Only hunger.</em></p><p class="text">He blinks. <em>Surprised.</em> Then \u2014 a smile. The kind that starts at the corner of the mouth and takes its time reaching the eyes, like a sunrise that knows it has all morning.</p><p class="text">\u201cNobody has ever poured for me,\u201d he says. And in that sentence is everything \u2014 <em>the power he carries like a robe, the loneliness inside the power, the exhaustion of always being the one who decides, the relief of meeting someone who takes the flask and says: sit down, drink, let someone else hold the weight for one night.</em></p><p class="text">He drinks. <strong>From your hand.</strong> You hold the cup to his mouth. He drinks. His eyes close. <em>And for the first time tonight, maybe for the first time in years, he is not in charge. He is not the host. He is just a man in a grove with a cup of wine and a stranger who saw through the performance.</em></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><strong>You lead. He follows. For one night, the power reverses. The grove doesn\u2019t care who leads. The grove cares that someone does. In the morning, he pours your coffee. He does it slowly. He has learned.</strong></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
how_knew:{
text:'<p class="text">\u201cHow did you know?\u201d</p><p class="text">They set down their cup. They look at you the way the torchlight looks at the wall \u2014 <em>illuminating everything, judging nothing</em>.</p><p class="text">\u201cI didn\u2019t,\u201d they say. \u201cI poured two cups. I lit the lamp. I left the curtain half-open. And I walked the grove for an hour, looking at everyone, <strong>waiting for the one who would walk past the feast, past the springs, past the first two curtains, and choose the third.</strong> The one with the patience to go deep. The one who doesn\u2019t grab the first offering.\u201d</p><p class="text">A pause. <em>\u201cYou chose the darkness. You chose the last alcove. You chose the unknown cup.\u201d</em></p><p class="text"><strong>\u201cThat is how I knew.\u201d</strong></p><p class="text">The lamp flickers. The rose petals exhale. The silk curtain is closed now \u2014 <em>who closed it? Neither of you. The grove closed it. The grove is the most discreet host in the ancient world.</em></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><strong>By morning, the two cups are empty. The lamp is out. The rose petals are crushed. And you know something you didn\u2019t know before: you can be chosen by a stranger who waited an hour in the dark, pouring wine for someone they hadn\u2019t met. That is faith. That is Daphne. That is the only religion that serves wine.</strong></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
feet_in:{
text:'<p class="text">You sit at the edge. Your feet enter the water. <em>Her water.</em> The temperature is a handshake \u2014 warm, firm, <strong>promising</strong>.</p><p class="text">She watches your feet. \u201cYou\u2019re being polite,\u201d she says. \u201cPolite is the enemy of honest. Polite is what the priests teach. <em>Honest is what the water teaches.</em>\u201d</p><p class="text">\u201cI want to talk first.\u201d</p><p class="text">\u201c<strong>Talk.</strong>\u201d She says it like a dare. She moves through the water toward you and stops when her shoulders are between your knees. She looks up. <em>You look down.</em> The geometry is ancient \u2014 the one on the edge, the one in the water, the conversation between the dressed and the undressed, between the careful and the committed.</p><p class="text">\u201cTell me about Apollo,\u201d you say.</p><p class="text">She laughs. <em>The sound bounces off the cave walls like music.</em> \u201cApollo,\u201d she says, \u201cwas a man who saw a woman running and thought she was playing. <strong>She was not playing. She was terrified.</strong> Every woman knows the difference. Every man should.\u201d</p><p class="text">She puts her wet hand on your ankle. <em>\u201cDo you know the difference?\u201d</em></p><p class="text"><strong>\u201cYes. That\u2019s why I\u2019m sitting here. Talking. With my feet in your water. Waiting for you to invite me in.\u201d</strong></p><p class="text"><em>She invites you in.</em></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><strong>The talk continues in the water. Then the talk stops. Then the water talks for both of you. It is more articulate than either of you. It has had more practice.</strong></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
},
the_difference:{
text:'<p class="text">\u201cWhat is the difference?\u201d</p><p class="text">She stands in the pool. The water falls from her shoulders. <em>She is not posing. She is not performing. She is standing the way a mountain stands \u2014 because it is there, because it has always been there, because the landscape organized itself around it and not the other way around.</em></p><p class="text">\u201cThe difference,\u201d she says, \u201cis <strong>the question</strong>. Apollo didn\u2019t ask. He chased. He reached. He grabbed. When his fingers touched her skin, she was already bark. <em>He held a tree. He held a tree for the rest of his eternal life.</em>\u201d</p><p class="text">\u201cI am standing in this water because I walked here. I undressed myself. I chose this pool. I chose this night. I chose to close my eyes and wait for someone who would <strong>approach with a question instead of a hand</strong>.\u201d</p><p class="text">She moves closer. <em>One step.</em> The water moves with her. The universe moves with her.</p><p class="text">\u201c<strong>You asked.</strong> That is the difference. That is the whole difference. Two thousand years of philosophy and theology and poetry and it all comes down to this: <em>he grabbed. You asked.</em>\u201d</p><p class="text">She takes your hand. Places it over her heart. <em>You feel it. Beating. Fast. Alive. Chosen.</em></p><p class="text"><strong>\u201cNow stop asking.\u201d</strong></p><div class="separator">\u00b7 \u00b7 \u00b7</div><p class="text"><em>You stop asking. The water holds you both. The question was the key. The answer is the grove. The answer is the night. The answer is the sound of two people who found each other because one of them knew how to ask and the other knew how to wait.</em></p>',
choices:[{text:"\ud83c\udf3f Begin again. Another path through the grove.",next:"arrival"}]
}
};

function lockGrove(){document.querySelector('.gate').innerHTML='<p class="locked">The gate closes. The laurels understand. Another night, perhaps. The grove is patient. It has been here for two thousand years. It will be here tomorrow.</p>'}

</script>
