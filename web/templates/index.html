<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mMonopoly — JuX Web Edition</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
h1 { text-align: center; padding: 16px; color: #f0c040; font-size: 1.6em; letter-spacing: 2px; }
#setup { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px; }
#setup input { padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #2a2a4a; color: #eee; font-size: 1em; width: 220px; }
#setup button { padding: 10px 28px; background: #f0c040; color: #1a1a2e; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; }
#game { display: none; gap: 12px; padding: 10px; }
#board-wrap { flex: 0 0 auto; }
#board { display: grid; grid-template-columns: repeat(11, 52px); grid-template-rows: repeat(11, 52px); gap: 2px; }
.cell { width: 52px; height: 52px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8px; text-align: center; position: relative; cursor: default; border: 1px solid #333; background: #16213e; overflow: hidden; }
.cell .cname { font-size: 7px; line-height: 1.1; padding: 1px; }
.cell .cbar { width: 100%; height: 8px; position: absolute; top: 0; }
.cell.corner { background: #0f3460; font-size: 10px; font-weight: bold; }
.cell.player-here { outline: 2px solid #f0c040; z-index: 2; }
.tokens { font-size: 13px; line-height: 1; }
.purple-bar { background: #9b59b6; }
.lblue-bar  { background: #3498db; }
.pink-bar   { background: #e91e8c; }
.orange-bar { background: #e67e22; }
.red-bar    { background: #e74c3c; }
.yellow-bar { background: #f1c40f; }
.green-bar  { background: #2ecc71; }
.dblue-bar  { background: #1a5276; }
.black-bar  { background: #2c3e50; }
.white-bar  { background: #bdc3c7; }
.owned-dot { position: absolute; bottom: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; }
#panel { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 260px; }
#players-info { display: flex; flex-wrap: wrap; gap: 8px; }
.player-card { background: #16213e; border-radius: 8px; padding: 10px 14px; flex: 1; min-width: 120px; border-left: 4px solid #f0c040; }
.player-card.active-player { border-left-color: #2ecc71; background: #0f3460; }
.player-card h3 { font-size: 0.9em; margin-bottom: 4px; }
.player-card .cash { font-size: 1.2em; color: #f0c040; font-weight: bold; }
.player-card .props { font-size: 0.75em; color: #aaa; margin-top: 4px; }
#actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9em; transition: opacity 0.2s; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-roll  { background: #f0c040; color: #1a1a2e; }
.btn-buy   { background: #2ecc71; color: #1a1a2e; }
.btn-pass  { background: #e74c3c; color: #fff; }
.btn-end   { background: #3498db; color: #fff; }
#log { background: #16213e; border-radius: 8px; padding: 10px; height: 220px; overflow-y: auto; font-size: 0.82em; line-height: 1.6; }
#log p { border-bottom: 1px solid #223; padding: 2px 0; }
#dice { font-size: 2em; text-align: center; letter-spacing: 8px; min-height: 48px; }
.phase-label { text-align: center; font-size: 0.8em; color: #aaa; }
</style>
</head>
<body>
<h1>🎲 mMonopoly — JuX Web Edition</h1>

<div id="setup">
  <p style="color:#aaa;margin-bottom:8px;">Enter player names (2–6 players)</p>
  <div id="name-inputs">
    <input type="text" placeholder="Player 1" value="Mamoun"><br><br>
    <input type="text" placeholder="Player 2" value="Player 2">
  </div>
  <button onclick="addPlayer()">+ Add Player</button>
  <button onclick="startGame()" style="background:#2ecc71;margin-top:8px;">▶ Start Game</button>
</div>

<div id="game" style="display:none;flex-direction:row;flex-wrap:wrap;">
  <div id="board-wrap" style="padding:8px;">
    <div id="board"></div>
  </div>
  <div id="panel">
    <div id="players-info"></div>
    <div id="dice">🎲 🎲</div>
    <div class="phase-label" id="phase-label">Waiting...</div>
    <div id="actions">
      <button class="btn btn-roll" id="btn-roll" onclick="doRoll()">🎲 Roll</button>
      <button class="btn btn-buy"  id="btn-buy"  onclick="doBuy()"  disabled>🏠 Buy</button>
      <button class="btn btn-pass" id="btn-pass" onclick="doPass()" disabled>⏭ Pass</button>
      <button class="btn btn-end"  id="btn-end"  onclick="doEnd()"  disabled>✅ End Turn</button>
    </div>
    <div id="mortgage-panel" style="background:#0d1b2e;border-radius:8px;padding:10px;margin-bottom:10px;min-height:40px;"></div>
    <div id="log"></div>
  </div>
</div>

<script>
const DICE_FACES = ['','⚀','⚁','⚂','⚃','⚄','⚅'];
const PLAYER_COLORS = ['#f0c040','#2ecc71','#e74c3c','#3498db','#e67e22','#9b59b6'];

let state = null;

function addPlayer() {
  const d = document.getElementById('name-inputs');
  const inputs = d.querySelectorAll('input');
  if (inputs.length >= 6) { alert('Max 6 players!'); return; }
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = 'Player ' + (inputs.length+1);
  inp.value = 'Player ' + (inputs.length+1);
  d.appendChild(document.createElement('br'));
  d.appendChild(document.createElement('br'));
  d.appendChild(inp);
}

async function startGame() {
  const inputs = document.querySelectorAll('#name-inputs input');
  const names = Array.from(inputs).map(i=>i.value.trim()).filter(n=>n);
  if (names.length < 2) { alert('Need at least 2 players!'); return; }
  const res = await fetch('/api/new', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({players: names})});
  state = await res.json();
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  renderAll();
}

async function doRoll() {
  const res = await fetch('/api/roll', {method:'POST'});
  state = await res.json();
  renderAll();
}
async function doBuy() {
  const res = await fetch('/api/buy', {method:'POST'});
  state = await res.json();
  renderAll();
}
async function doPass() {
  const res = await fetch('/api/pass', {method:'POST'});
  state = await res.json();
  renderAll();
}
async function doEnd() {
  const res = await fetch('/api/end_turn', {method:'POST'});
  state = await res.json();
  renderAll();
}
async function doMortgage(sqIdx) {
  const res = await fetch('/api/mortgage', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({sq_idx: sqIdx})});
  state = await res.json();
  renderAll();
}
async function doUnmortgage(sqIdx) {
  const res = await fetch('/api/unmortgage', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({sq_idx: sqIdx})});
  state = await res.json();
  renderAll();
}

const COLOR_CLASSES = {purple:'purple-bar',lblue:'lblue-bar',pink:'pink-bar',orange:'orange-bar',red:'red-bar',yellow:'yellow-bar',green:'green-bar',dblue:'dblue-bar',black:'black-bar',white:'white-bar'};

// Board layout: square index -> grid position [row, col] (1-indexed)
function boardLayout() {
  const layout = {};
  // Bottom row (left to right): squares 0-10
  for (let i=0;i<=10;i++) layout[i]=[11,i+1];
  // Left col (bottom to top): squares 11-20
  for (let i=0;i<9;i++) layout[11+i]=[10-i,1];
  // Top row: squares 20-30
  for (let i=0;i<=10;i++) layout[20+i]=[1,i+1];
  // Right col: squares 31-39
  for (let i=0;i<9;i++) layout[31+i]=[i+2,11];
  return layout;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const layout = boardLayout();
  const grid = Array.from({length:11},()=>Array(11).fill(null));
  
  // Place squares
  state.board.forEach((sq,idx)=>{
    const [r,c] = layout[idx];
    grid[r-1][c-1] = {sq, idx};
  });
  // Center cell
  grid[5][5] = {sq:{name:'JuX',type:'center',color:null},idx:-1};

  // Find players on each cell
  const playersOn = {};
  state.players.forEach((p,pi)=>{
    if (!playersOn[p.position]) playersOn[p.position]=[];
    playersOn[p.position].push(pi);
  });

  for (let r=0;r<11;r++) {
    for (let c=0;c<11;c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const item = grid[r][c];
      if (!item) { cell.style.background='transparent'; cell.style.border='none'; board.appendChild(cell); continue; }
      const {sq,idx} = item;
      if (sq.type==='center') {
        cell.style.gridColumn='2/11'; cell.style.gridRow='2/11';
        cell.style.background='#0a0a1a'; cell.style.border='2px solid #f0c040';
        cell.style.fontSize='18px'; cell.style.fontWeight='bold'; cell.style.color='#f0c040';
        cell.innerHTML='<div>🎲<br>mMonopoly<br><span style="font-size:11px;color:#aaa">JuX Web Edition</span></div>';
        board.appendChild(cell); continue;
      }
      if (['go','jail','gotojail','parking'].includes(sq.type)) cell.classList.add('corner');
      if (sq.color && COLOR_CLASSES[sq.color]) {
        const bar = document.createElement('div');
        bar.className = 'cbar ' + COLOR_CLASSES[sq.color];
        cell.appendChild(bar);
      }
      const name = document.createElement('div');
      name.className = 'cname';
      name.textContent = sq.name;
      cell.appendChild(name);

      // Owner dot
      if (state.owners && state.owners[idx] !== undefined) {
        const dot = document.createElement('div');
        dot.className = 'owned-dot';
        dot.style.background = PLAYER_COLORS[state.owners[idx]];
        cell.appendChild(dot);
      }
      // Mortgaged indicator
      if (state.mortgaged && state.mortgaged[idx]) {
        const mort = document.createElement('div');
        mort.style.cssText = 'font-size:9px;color:#ff4444;font-weight:bold;text-align:center;';
        mort.textContent = 'M';
        cell.appendChild(mort);
      }

      // Tokens
      const here = playersOn[idx];
      if (here && here.length > 0) {
        cell.classList.add('player-here');
        const tok = document.createElement('div');
        tok.className = 'tokens';
        tok.textContent = here.map(pi=>state.players[pi].token).join('');
        cell.appendChild(tok);
      }

      board.appendChild(cell);
    }
  }
}

function renderPlayers() {
  const div = document.getElementById('players-info');
  div.innerHTML = '';
  state.players.forEach((p,i)=>{
    const card = document.createElement('div');
    card.className = 'player-card' + (i===state.current?' active-player':'');
    card.style.borderLeftColor = PLAYER_COLORS[i];
    card.innerHTML = `<h3>${p.token} ${p.name}${i===state.current?' ◀':''}</h3>
      <div class="cash">$${p.cash}</div>
      <div class="props">${p.properties.length} properties${p.in_jail?' 👮 JAIL':''}</div>`;
    div.appendChild(card);
  });
}

function renderActions() {
  const phase = state.phase;
  document.getElementById('btn-roll').disabled = phase !== 'roll';
  document.getElementById('btn-buy').disabled  = phase !== 'buy';
  document.getElementById('btn-pass').disabled = phase !== 'buy';
  document.getElementById('btn-end').disabled  = phase !== 'end';
  document.getElementById('phase-label').textContent = 
    phase==='roll'?'Your turn — Roll the dice!':
    phase==='buy' ?'Buy this property?':
    phase==='end' ?'Click End Turn to continue':'...';
  if (state.last_roll) {
    document.getElementById('dice').textContent = DICE_FACES[state.last_roll[0]] + ' ' + DICE_FACES[state.last_roll[1]];
  }
}

function renderLog() {
  const div = document.getElementById('log');
  div.innerHTML = [...state.log].reverse().slice(0,30).map(l=>`<p>${l}</p>`).join('');
}

function renderMortgagePanel() {
  const div = document.getElementById('mortgage-panel');
  if (!div) return;
  const player = state.players[state.current];
  if (!player || player.properties.length === 0) {
    div.innerHTML = '<p style="color:#888;font-size:12px">No properties to mortgage.</p>';
    return;
  }
  div.innerHTML = '<p style="color:#f0c040;font-size:12px;margin:0 0 6px 0">🏦 Your Properties:</p>';
  player.properties.forEach(sqIdx => {
    const sq = state.board[sqIdx];
    const isMortgaged = state.mortgaged && state.mortgaged[sqIdx];
    const mortgageVal = Math.floor(sq.price / 2);
    const unmortgageCost = Math.floor(mortgageVal * 1.1);
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin:3px 0;font-size:12px;';
    const label = document.createElement('span');
    label.textContent = (isMortgaged ? '🔴 ' : '🟢 ') + sq.name;
    label.style.color = isMortgaged ? '#ff6666' : '#ccc';
    const btn = document.createElement('button');
    if (isMortgaged) {
      btn.textContent = `Lift $${unmortgageCost}`;
      btn.style.cssText = 'background:#2a6a2a;color:#fff;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px;';
      btn.onclick = () => doUnmortgage(sqIdx);
    } else {
      btn.textContent = `Mortgage $${mortgageVal}`;
      btn.style.cssText = 'background:#6a2a2a;color:#fff;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px;';
      btn.onclick = () => doMortgage(sqIdx);
    }
    row.appendChild(label);
    row.appendChild(btn);
    div.appendChild(row);
  });
}

function renderAll() {
  renderBoard();
  renderPlayers();
  renderActions();
  renderMortgagePanel();
  renderLog();
}
</script>
</body>
</html>
